spring:
  datasource:
    url: jdbc:h2:mem:rider_db
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    defer-datasource-initialization: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  sql:
    init:
      mode: never

server:
  port: 8081

logging:
  level:
    root: INFO
    com.rides.riderservice: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %X{correlationId} - %msg%n"

rider:
  seed:
    csv-path: ${RIDER_SEED_CSV_PATH:ride_riders.csv}
